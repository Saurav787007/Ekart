
name: Shopping Cart CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compile project
        run: mvn -B -ntp compile

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy scan
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --skip-dirs .git \
            --format table \
            --output trivy-report.txt \
            .

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt
          if-no-files-found: ignore

      - name: Install Gitleaks
        run: |
          VERSION="8.24.2"
          wget -q \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for leaked secrets
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --redact \
            --exit-code 1

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        run: mvn -B -ntp clean test

      - name: Display test failure details
        if: steps.unit-tests.outcome == 'failure'
        run: |
          echo "===== Surefire test reports ====="
          find . -type f -path '*/target/surefire-reports/*.txt' \
            -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;

          echo "===== Test XML error details ====="
          find . -type f -path '*/target/surefire-reports/TEST-*.xml' \
            -exec sh -c 'echo "===== $1 ====="; grep -E "failure|error|Exception|Caused by" "$1" | head -80' _ {} \;

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

      - name: Fail pipeline if tests failed
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1

  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: [test, security-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build application
        run: mvn -B -ntp clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app

      - name: Verify JAR
        run: |
          ls -lh app/
          test -n "$(find app -maxdepth 1 -name '*.jar' -print -quit)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            saurav787007/bankapp:latest
            saurav787007/bankapp:${{ github.sha }}
